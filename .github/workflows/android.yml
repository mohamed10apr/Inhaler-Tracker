name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: ./Inhaler-Tracker # Change this if your Android files are inside a different folder name

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: ./Inhaler-Tracker

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      working-directory: ./Inhaler-Tracker

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: Inhaler-Tracker/app/build/outputs/apk/debug/app-debug.apk
