plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inhalertracker.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inhalertracker.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// No external dependencies on purpose: the whole app uses only the
// Android framework, which keeps the build simple and reliable.
